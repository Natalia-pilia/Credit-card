<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="credit_card">
        <div class="top_part">
            <img src="left_orange.svg" alt="decoration">
            <h2>Kevin Bank</h2>
            <img src="right_orange.svg" alt="decoration">
        </div>
        

        <div class="middle_part">
            <div>
                <h2><span>1234</span><span>5678</span><span>9012</span><span>3456</span></h2>
                <p>John Doe</p>
            </div>
        </div>
        <div class="bottom_part">
            <div class="valid">
                <p>valid <br> from
                <span>11/26</span></p>
            
                <p>valid <br> thru
                <span>11/30</span></p>
            </div>
        </div>
        
        <img class="mastercard" src="MasterCard.svg" alt="MasterCard">
        <img class="rect" src="chip.svg">
        <img class="nfc" src="NFC.svg" alt="NFC_icon">

    </div>
</body>
</html>
